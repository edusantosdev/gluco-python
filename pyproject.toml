[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gluco-bar"
version = "1.0.4"
description = "Glucobar — macOS menubar glucose display backed by LibreView."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
keywords = ["glucose", "libreview", "librelinkup", "menubar", "macos", "cgm", "freestyle-libre"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
# All four runtime components — daemon HTTP server, polling client,
# menubar frontend, and credentials helper — are needed for daily use,
# so they all live under the default install set. ``pip install -e .``
# alone is enough to run the app; no extras dance.
dependencies = [
    # LibreView client library used by the daemon and the phase-0 probe.
    # (Package is named ``pylibrelinkup`` for historical reasons; it talks
    # to the LibreView backend the web dashboard uses.)
    "pylibrelinkup>=0.11.1,<0.12",
    # Menubar UI; pulls in pyobjc-framework-Cocoa, which gives us
    # ``AppKit`` and ``Foundation`` for the native dialogs in the frontend.
    "rumps>=0.4.0",
    # ``.env`` loader used by the daemon, the frontend, and the probe.
    "python-dotenv>=1.2.4",
    # Keychain bridge for credentials.
    "keyring>=25.7",
    # Daemon HTTP API.
    "fastapi>=0.143",
    "pydantic>=2.14",
    "uvicorn>=0.54",
    # Typed settings for the daemon.
    "pydantic-settings>=2.15",
    # Synchronous HTTP client used by the frontend to talk to the daemon.
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
    # Starlette's TestClient now prefers httpx2; tests only. The app itself
    # keeps using httpx for its daemon client.
    "httpx2>=2.13.1",
]
build = [
    "py2app>=0.28.10",
    # py2app 0.28.10 calls distutils ``spawn(..., verbose=...)``, which the
    # distutils bundled with setuptools 84 no longer accepts. Lift this cap
    # once a py2app release stops passing ``verbose``.
    "setuptools<84",
]

# Flat layout with three sibling top-level packages — setuptools' default
# auto-discovery refuses to build that without an explicit list, so we
# enumerate them here. ``scripts/`` stays out on purpose: those are run
# directly from the repo, not installed as part of the package.
[tool.setuptools]
packages = ["daemon", "glucose_common", "macos_frontend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
