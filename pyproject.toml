[project]
name = "glucose-display"
version = "0.1.0"
description = "Personal glucose menubar app for macOS (Phase 1 MVP)"
requires-python = ">=3.11"
dependencies = [
    "pylibrelinkup>=0.10.0,<0.12",
    "rumps>=0.4.0",
    "python-dotenv>=1.0.0",
    "keyring>=24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
daemon = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
