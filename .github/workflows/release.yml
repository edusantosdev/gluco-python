name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (for example: v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release tag
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev,build]"

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest tests/

      - name: Run lint
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m ruff check .

      - name: Build standalone app
        shell: bash
        run: |
          set -euo pipefail
          scripts/build_portable_app.sh

      - name: Package release artifact
        shell: bash
        run: |
          set -euo pipefail
          scripts/package_release_artifact.sh \
            --version "${{ steps.vars.outputs.tag }}" \
            --repo "${{ github.repository }}"

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          files: |
            release/GlucoBar-${{ steps.vars.outputs.tag }}-macos.zip
            release/GlucoBar-${{ steps.vars.outputs.tag }}-macos.zip.sha256
            release/homebrew-cask-snippet.rb
